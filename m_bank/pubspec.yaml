name: m_bank
description: "M-Bank - Aplikasi Mobile Nasabah Bank Mini"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure Storage for tokens
  flutter_secure_storage: ^9.2.4

  # Internationalization & formatting
  intl: ^0.20.2

  # Google Fonts
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
